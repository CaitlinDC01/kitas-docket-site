<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Counselor Kita's Daily Docket</title>

  <!-- Fonts for the softer, rounded aesthetic: Fredoka for headlines, Inter for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!--
    Tailwind CDN — the app's className utilities (flex, grid, spacing, etc.)
    depend on this. Without it, layout silently collapses since there's no
    build step generating a real Tailwind stylesheet for this static site.
  -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* Prevents any stray wide element from creating page-level horizontal scroll */
      overflow-x: hidden;
      max-width: 100%;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #FBF5EE;
    }
    * {
      box-sizing: border-box;
    }
    #root {
      overflow-x: hidden;
      max-width: 100%;
    }
    /* Keeps form fields comfortably readable and prevents unwanted
       browser zoom-on-focus behavior, on both iOS and Android. */
    input, select, textarea {
      font-size: 16px !important;
    }
    /* Respects safe areas on phones with notches, cutouts, or gesture
       nav bars — works on modern iOS and Android; does nothing on
       phones without one (like a folded/unfolded Galaxy screen). */
    body {
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
  </style>
  <meta name="theme-color" content="#332F4D" />
</head>
