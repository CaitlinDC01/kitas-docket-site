    Tailwind CDN — the app's className utilities (flex, grid, spacing, etc.)

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* Prevents any stray wide element from creating page-level horizontal scroll */
      overflow-x: hidden;
      max-width: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    #root {
      overflow-x: hidden;
      max-width: 100%;
    }
    /* iOS Safari auto-zooms on focus if an input's font-size is under 16px.
       This overrides Tailwind's smaller text sizes on form controls only. */
    input, select, textarea {
      font-size: 16px !important;
    }
    /* Respect the iPhone home-indicator / notch safe areas */
    body {
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
  </style>
</head>
